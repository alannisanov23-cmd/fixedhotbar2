name: Build mod jar

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If the project was uploaded as a .zip (GitHub does not unzip uploads), unpack it first.
      - name: Unpack any uploaded zip
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -n1)" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do
              echo "Unzipping $z"
              unzip -o -q "$z" -d "_unzipped_$(basename "$z" .zip)"
            done
          fi

      - name: Find Gradle project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle found anywhere in the repo. Files present:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Gradle project is in: $(dirname "$f")"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Collect jar
        run: |
          mkdir -p dist
          for j in "${{ steps.proj.outputs.dir }}"/build/libs/*.jar; do
            case "$j" in *-sources.jar) ;; *) cp "$j" dist/ ;; esac
          done
          ls -l dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: biomehotbar-jar
          path: dist/*.jar

      - name: Publish GitHub release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.jar
